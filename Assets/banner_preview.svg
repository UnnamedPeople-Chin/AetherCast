<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="spaceVoid" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>

    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-outfit { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Space Canvas -->
  <rect width="1280" height="640" fill="url(#spaceVoid)"/>

  <!-- Perspective Floor Grid (Cyberpunk Tron-style) -->
  <g stroke="#00f3ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="640" y1="360" x2="-200" y2="640"/>
    <line x1="640" y1="360" x2="100" y2="640"/>
    <line x1="640" y1="360" x2="400" y2="640"/>
    <line x1="640" y1="360" x2="640" y2="640"/>
    <line x1="640" y1="360" x2="880" y2="640"/>
    <line x1="640" y1="360" x2="1180" y2="640"/>
    <line x1="640" y1="360" x2="1480" y2="640"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="0" y1="520" x2="1280" y2="520"/>
    <line x1="0" y1="570" x2="1280" y2="570"/>
    <line x1="0" y1="610" x2="1280" y2="610"/>
  </g>

  <!-- Ambient Particle Stardust -->
  <g fill="#00f3ff" opacity="0.65" filter="url(#bloom)">
    <circle cx="120" cy="90" r="2.5"/>
    <circle cx="280" cy="180" r="1.5"/>
    <circle cx="390" cy="80" r="2"/>
    <circle cx="560" cy="150" r="3" fill="#ffffff"/>
    <circle cx="720" cy="95" r="2.5" fill="#a855f7"/>
    <circle cx="890" cy="160" r="2"/>
    <circle cx="1080" cy="110" r="3.5" fill="#ff0077"/>
    <circle cx="1190" cy="220" r="2"/>
    <circle cx="480" cy="310" r="1.5"/>
    <circle cx="780" cy="330" r="2"/>
    <circle cx="950" cy="290" r="3" fill="#ffd700"/>
    <circle cx="150" cy="380" r="2"/>
    <circle cx="1140" cy="410" r="2.5"/>
  </g>

  <!-- ==================== LEFT EFFECT: DOCTOR STRANGE MANDALA SHIELD ==================== -->
  <g transform="translate(420, 270)">
    <!-- Outer Glow Aura -->
    <circle r="145" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 14"/>
    
    <!-- Rotating Outer Runes Ring -->
    <circle r="130" fill="none" stroke="url(#mandalaGold)" stroke-width="4" filter="url(#bloom)" opacity="0.9"/>
    <circle r="122" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle r="112" fill="none" stroke="url(#mandalaGold)" stroke-width="2" stroke-dasharray="16 8 4 8" opacity="0.8"/>

    <!-- Concentric Sacred Squares (Rotated 30° / 60°) -->
    <g filter="url(#bloom)" stroke="url(#mandalaGold)" stroke-width="2" fill="none" opacity="0.85">
      <rect x="-76" y="-76" width="152" height="152"/>
      <rect x="-76" y="-76" width="152" height="152" transform="rotate(30)"/>
      <rect x="-76" y="-76" width="152" height="152" transform="rotate(60)"/>
    </g>

    <!-- Inner Core Glyph & Sun Burst -->
    <circle r="44" fill="#180e02" stroke="url(#mandalaGold)" stroke-width="3" filter="url(#bloom)"/>
    <circle r="36" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="16" fill="#ffffff" filter="url(#intenseBloom)"/>

    <!-- Sparks Flying from Mandala Edge -->
    <g stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="130" y1="0" x2="155" y2="-15"/>
      <line x1="-120" y1="40" x2="-145" y2="55"/>
      <line x1="70" y1="110" x2="92" y2="135"/>
      <line x1="-80" y1="-100" x2="-105" y2="-125"/>
    </g>

    <!-- Label Badge -->
    <rect x="-105" y="160" width="210" height="30" rx="15" fill="#090d16" stroke="url(#mandalaGold)" stroke-width="1.5"/>
    <text x="0" y="180" fill="#ffd700" class="font-outfit" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">MANDALA SHIELD (90° TWIST)</text>
  </g>

  <!-- ==================== CENTER-RIGHT EFFECT: GIGA BLACKHOLE WITH EINSTEIN LENSING ==================== -->
  <g transform="translate(860, 260)">
    <!-- Einstein Gravitational Lensing Arcs (Bending Over & Under) -->
    <path d="M-170 -20 C-150 -130, 150 -130, 170 -20" fill="none" stroke="url(#neonPink)" stroke-width="8" filter="url(#intenseBloom)" opacity="0.85"/>
    <path d="M-150 -10 C-130 -110, 130 -110, 150 -10" fill="none" stroke="#ffffff" stroke-width="2.5" filter="url(#bloom)" opacity="0.9"/>
    
    <path d="M-160 30 C-140 120, 140 120, 160 30" fill="none" stroke="url(#neonPink)" stroke-width="6" filter="url(#bloom)" opacity="0.6"/>

    <!-- Accretion Disk Vortex (Elliptical High Speed Rotation) -->
    <ellipse cx="0" cy="10" rx="190" ry="52" fill="none" stroke="url(#neonCyan)" stroke-width="6" filter="url(#intenseBloom)" opacity="0.9" transform="rotate(-12)"/>
    <ellipse cx="0" cy="10" rx="170" ry="42" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="80 30 140 40" filter="url(#bloom)" opacity="0.95" transform="rotate(-12)"/>
    <ellipse cx="0" cy="10" rx="140" ry="32" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="30 15 60 15" filter="url(#bloom)" opacity="0.8" transform="rotate(-12)"/>

    <!-- Relativistic Doppler Beaming Flare (Approaching Left Side) -->
    <ellipse cx="-130" cy="-14" rx="45" ry="16" fill="#ffffff" filter="url(#intenseBloom)" opacity="0.95" transform="rotate(-12)"/>

    <!-- Coronal Prominence Plasma Loops -->
    <path d="M-90 -30 Q-130 -90, -70 -70" fill="none" stroke="#ff0077" stroke-width="2.5" filter="url(#bloom)" opacity="0.8"/>
    <path d="M80 -35 Q140 -85, 100 -65" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#bloom)" opacity="0.8"/>
    <path d="M-110 45 Q-150 95, -80 75" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#bloom)" opacity="0.75"/>

    <!-- Pitch-Black Event Horizon Void -->
    <circle r="60" fill="#000000" stroke="url(#neonCyan)" stroke-width="3" filter="url(#bloom)"/>
    <circle r="56" fill="#000000"/>

    <!-- Foreground Accretion Slice (Cutting front of Void) -->
    <path d="M-185 45 C-90 85, 90 85, 185 45" fill="none" stroke="url(#neonCyan)" stroke-width="5" filter="url(#bloom)" opacity="0.9" transform="rotate(-12)"/>

    <!-- High-Voltage Jagged Lightning Arcs from Fists -->
    <path d="M-220 120 L-180 80 L-140 85 L-110 50 L-60 20" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#intenseBloom)"/>
    <path d="M220 120 L180 80 L150 75 L110 40 L60 15" fill="none" stroke="#ff0077" stroke-width="2.5" filter="url(#intenseBloom)"/>

    <!-- Inflow Ingestion Whirlpool Particles -->
    <g fill="#00f3ff" opacity="0.85">
      <circle cx="-130" cy="-60" r="2.5" filter="url(#bloom)"/>
      <circle cx="-100" cy="-45" r="2"/>
      <circle cx="-70" cy="-30" r="3" fill="#fff"/>
      <circle cx="120" cy="50" r="2"/>
      <circle cx="85" cy="35" r="2.5" fill="#ff0077"/>
      <circle cx="55" cy="20" r="1.5"/>
    </g>

    <!-- Label Badge -->
    <rect x="-115" y="160" width="230" height="30" rx="15" fill="#090d16" stroke="url(#neonCyan)" stroke-width="1.5"/>
    <text x="0" y="180" fill="#00f3ff" class="font-outfit" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">GIGA BLACKHOLE (DUAL FIST)</text>
  </g>

  <!-- ==================== INTER-HAND COSMIC ORB THROW TRAJECTORY ==================== -->
  <g>
    <!-- Parabolic Homing Arc Path -->
    <path d="M480 180 Q640 60, 780 190" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" stroke-dasharray="8 6" filter="url(#intenseBloom)" opacity="0.85"/>
    
    <!-- Flying Cosmic Projectile Orb -->
    <g transform="translate(635, 115)" filter="url(#intenseBloom)">
      <!-- Comet Plasma Tail -->
      <path d="M-40 15 L0 0 L-35 -10" fill="none" stroke="url(#neonPink)" stroke-width="3" opacity="0.7"/>
      <circle r="18" fill="url(#neonCyan)" fill-opacity="0.3"/>
      <circle r="11" fill="url(#neonPink)" fill-opacity="0.8"/>
      <circle r="6" fill="#ffffff"/>
      <!-- Lightning Tendril -->
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ffffff" stroke-width="2"/>
      <line x1="14" y1="-8" x2="-10" y2="10" stroke="#00f3ff" stroke-width="1.5"/>
    </g>

    <!-- Throw Label Badge -->
    <rect x="535" y="45" width="200" height="26" rx="13" fill="#090d16" stroke="url(#neonPink)" stroke-width="1.2"/>
    <text x="635" y="62" fill="#ff0077" class="font-outfit" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ INTER-HAND ORB THROW</text>
  </g>

  <!-- ==================== LEFT FLOATING UI: CONTROL PANEL ==================== -->
  <g transform="translate(36, 110)">
    <!-- Glassmorphic Card Container -->
    <rect width="260" height="360" rx="16" fill="url(#panelGlass)" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.35" filter="url(#bloom)"/>
    <rect width="258" height="358" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

    <!-- Panel Header -->
    <g transform="translate(18, 30)">
      <path d="M0 6 L12 0 L24 6 L24 18 L12 24 L0 18 Z" fill="none" stroke="#00f3ff" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="4" fill="#00f3ff"/>
      <text x="34" y="16" fill="#ffffff" class="font-outfit" font-size="14" font-weight="800" letter-spacing="1">CONTROL PANEL</text>
    </g>

    <!-- Palette Section -->
    <text x="18" y="78" fill="#94a3b8" class="font-outfit" font-size="11" font-weight="600" letter-spacing="0.5">NEON COLOR PALETTES</text>
    
    <!-- 5 Palette Circles -->
    <g transform="translate(18, 92)">
      <!-- Cyan Active Ring -->
      <circle cx="14" cy="14" r="15" fill="none" stroke="#00f3ff" stroke-width="2"/>
      <circle cx="14" cy="14" r="10" fill="#00f3ff"/>

      <!-- Rose / Pink -->
      <circle cx="48" cy="14" r="10" fill="#ff0077"/>
      <!-- Purple -->
      <circle cx="82" cy="14" r="10" fill="#a855f7"/>
      <!-- Emerald -->
      <circle cx="116" cy="14" r="10" fill="#10b981"/>
      <!-- Rainbow -->
      <circle cx="150" cy="14" r="10" fill="url(#neonCyanPurple)"/>
    </g>

    <!-- Sliders -->
    <g transform="translate(18, 145)">
      <text x="0" y="0" fill="#94a3b8" class="font-outfit" font-size="11" font-weight="600">Particle Density</text>
      <text x="224" y="0" fill="#00f3ff" class="font-mono" font-size="11" font-weight="700" text-anchor="end">500</text>
      <!-- Track -->
      <rect x="0" y="8" width="224" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="8" width="160" height="5" rx="2.5" fill="url(#neonCyan)"/>
      <circle cx="160" cy="10.5" r="7" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
    </g>

    <g transform="translate(18, 195)">
      <text x="0" y="0" fill="#94a3b8" class="font-outfit" font-size="11" font-weight="600">Webcam Darkness</text>
      <text x="224" y="0" fill="#00f3ff" class="font-mono" font-size="11" font-weight="700" text-anchor="end">70%</text>
      <rect x="0" y="8" width="224" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="8" width="140" height="5" rx="2.5" fill="url(#neonCyan)"/>
      <circle cx="140" cy="10.5" r="7" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(18, 240)">
      <!-- Webcam Button -->
      <rect width="224" height="32" rx="8" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
      <text x="112" y="21" fill="#ffffff" class="font-outfit" font-size="12" font-weight="700" text-anchor="middle">📷 Toggle Webcam</text>

      <!-- Skeleton Button -->
      <rect y="40" width="224" height="32" rx="8" fill="#0f172a" stroke="#00f3ff" stroke-width="1.2"/>
      <text x="112" y="61" fill="#00f3ff" class="font-outfit" font-size="12" font-weight="700" text-anchor="middle">🖐️ Energy Skeleton</text>
    </g>
  </g>

  <!-- ==================== TOP HEADER OVERLAY ==================== -->
  <g transform="translate(36, 30)">
    <!-- Brand Box -->
    <g>
      <rect width="280" height="56" rx="14" fill="#090d16" fill-opacity="0.85" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- Brand Icon -->
      <circle cx="28" cy="28" r="16" fill="#00f3ff" fill-opacity="0.2"/>
      <path d="M22 28 L28 20 L34 28" fill="none" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="3" fill="#ffffff"/>
      <!-- Brand Text -->
      <text x="54" y="27" fill="#ffffff" class="font-outfit" font-size="16" font-weight="900" letter-spacing="2">AETHERCAST</text>
      <text x="54" y="43" fill="#00f3ff" class="font-outfit" font-size="10" font-weight="600" letter-spacing="1">REALTIME HAND-TRACKING SANDBOX</text>
    </g>

    <!-- Status Badges (Right Top) -->
    <g transform="translate(860, 6)">
      <!-- Status Badge -->
      <rect width="190" height="42" rx="21" fill="#090d16" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="5" fill="#10b981" filter="url(#bloom)"/>
      <text x="36" y="26" fill="#10b981" class="font-outfit" font-size="12" font-weight="700">2 Hands Active</text>

      <!-- FPS Badge -->
      <g transform="translate(200, 0)">
        <rect width="120" height="42" rx="21" fill="#090d16" fill-opacity="0.9" stroke="#00f3ff" stroke-width="1.2"/>
        <text x="60" y="26" fill="#00f3ff" class="font-mono" font-size="13" font-weight="700" text-anchor="middle">⚡ 144 FPS</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM FEATURE CHIPS ==================== -->
  <g transform="translate(180, 560)">
    <!-- Chip 1: Offscreen Worker -->
    <g transform="translate(0, 0)">
      <rect width="205" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="102" y="24" fill="#cbd5e1" class="font-outfit" font-size="12" font-weight="600" text-anchor="middle">🚀 Decoupled 7ms Engine</text>
    </g>

    <!-- Chip 2: MediaPipe Hands -->
    <g transform="translate(225, 0)">
      <rect width="215" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="107" y="24" fill="#cbd5e1" class="font-outfit" font-size="12" font-weight="600" text-anchor="middle">🖐️ 21 3D Landmark Tracking</text>
    </g>

    <!-- Chip 3: Procedural Vector Physics -->
    <g transform="translate(460, 0)">
      <rect width="215" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="107" y="24" fill="#cbd5e1" class="font-outfit" font-size="12" font-weight="600" text-anchor="middle">🌌 Procedural Vector Physics</text>
    </g>

    <!-- Chip 4: HTML5 Canvas 2D + Electron -->
    <g transform="translate(695, 0)">
      <rect width="225" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="112" y="24" fill="#cbd5e1" class="font-outfit" font-size="12" font-weight="600" text-anchor="middle">⚡ Electron + HTML5 Canvas 2D</text>
    </g>
  </g>
</svg>
